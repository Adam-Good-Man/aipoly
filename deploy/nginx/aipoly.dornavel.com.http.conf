# /etc/nginx/conf.d/aipoly.dornavel.com.conf
#
# 仅 HTTP — 用于首次 certbot 申请证书（证书签发前 nginx -t 不能加载 HTTPS 配置）。
# setup-ssl.sh 会在 certbot 成功后替换为 aipoly.dornavel.com.conf

server {
    listen 80;
    listen [::]:80;
    server_name aipoly.dornavel.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    root /opt/aipoly/client/dist;
    index index.html;
    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
