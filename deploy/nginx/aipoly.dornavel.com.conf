# /etc/nginx/conf.d/aipoly.dornavel.com.conf
#
# aiPoly 生产站点：aipoly.dornavel.com
#   - 静态前端：/opt/aipoly/client/dist
#   - /api/*   → Go API 127.0.0.1:8081（保留 /api 前缀，与 Gin 路由一致）
#
# 注意：不在此文件定义 map $connection_upgrade（已在 00-corefabria-ws-map.conf）。
# 不与 rhubapi / dornavel.com / admin.dornavel.com 共用 server_name。
#
# 首次 HTTPS：先 deploy/setup-ssl.sh，或手动 certbot 后再启用本文件。

# ─── HTTPS ───────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aipoly.dornavel.com;

    ssl_certificate     /etc/letsencrypt/live/aipoly.dornavel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aipoly.dornavel.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/aipoly/client/dist;
    index index.html;
    client_max_body_size 32m;

    # API（同源访问，无需额外 CORS）
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Vue SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ─── HTTP → HTTPS 重定向（保留 ACME 验证路径）────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name aipoly.dornavel.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
